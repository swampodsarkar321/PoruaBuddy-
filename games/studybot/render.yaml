services:
  - type: web
    name: poruabuddy
    runtime: python
    rootDir: games/studybot
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: OPENROUTER_KEY
        sync: false
      - key: GEMINI_KEY
        sync: false
      - key: ADMIN_ID
        value: "8273686230"
      - key: PYTHONUTF8
        value: "1"
    healthCheckPath: /health
